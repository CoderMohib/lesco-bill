name: Update NEPRA rates

on:
  schedule:
    # Every Sunday 06:00 UTC (~weekly refresh)
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scan NEPRA and refresh data/rates.json
        run: node scripts/update-rates.mjs

      - name: Commit if rates changed
        run: |
          if git diff --quiet -- data/rates.json; then
            echo "No rate file changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          git commit -m "chore: refresh NEPRA FCA/QTA rates"
          git push
